<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>尿検査キット 法人見積依頼｜MEDI ALPHA PLUS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="section" id="pricing">
  <div class="container">

    <div class="cost-comparison">
      <h3>内製コストと比べてみてください</h3>

      <p class="compare-note">
        ※数量・納品条件により変動します。正確な価格はお見積もりにてご確認ください。<br>
        ※表示価格はすべて税抜です。<br>
        ※数量・仕様・納品条件により単価は変動します。<br>
        ※法人特価は継続数量・納期・納品条件を踏まえて個別にご案内します。
      </p>
    </div>

    <div class="trust-numbers">

      <div class="trust-num-item">
        <div class="trust-number">15<span>万セット/年</span></div>
        <div class="trust-num-label">大手検査センター年間導入実績</div>
      </div>

      <div class="trust-num-item">
        <div class="trust-number">98<span>%</span></div>
        <div class="trust-num-label">継続利用率</div>
      </div>

      <div class="trust-num-item">
        <div class="trust-number">月40<span>時間削減</span></div>
        <div class="trust-num-label">残業時間削減（導入事例）</div>
      </div>

      <div class="trust-num-item">
        <div class="trust-number">365<span>日</span></div>
        <div class="trust-num-label">安定供給体制</div>
      </div>

      <div class="results-notes">
        <p>※1 自社集計による実績値です。</p>
        <p>※2 一部継続取引先を含む実績です。</p>
        <p>※3 導入事例ベース。内製方法・人員体制・運用状況により削減幅は異なります。</p>
      </div>

    </div>

  </div>
</section>

</body>
</html>
